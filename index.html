<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f6b5c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>CYCLONE Simulator</title>
<style>
:root{--bg:#f4f6f8;--panel:#ffffff;--ink:#16202e;--mut:#5b6778;--line:#d8dee6;--acc:#0f6b5c;--accsoft:#e0f0ec;--accink:#ffffff;
--q:#94540a;--qf:#fbefdc;--n:#2c5aa6;--nf:#e3ecf9;--c:#0f6b5c;--cf:#dcefeb;--f:#7a4aa3;--ff:#eee4f6;--arc:#69758a;--bad:#b3261e;--grid:#e6eaf0}
@media (prefers-color-scheme:dark){:root{--bg:#0f141b;--panel:#18202b;--ink:#e8edf3;--mut:#9aa7b8;--line:#2b3544;--acc:#4cc2ae;--accsoft:#173a35;--accink:#06201c;--q:#f0a04b;--qf:#3a2a14;--n:#86adf0;--nf:#18263d;--c:#4cc2ae;--cf:#123a33;--f:#c9a4ec;--ff:#2e1f3d;--arc:#8c99ab;--bad:#ff8a80;--grid:#1e2733}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
body{display:flex;flex-direction:column;height:100dvh;user-select:none;-webkit-user-select:none}
header{display:flex;align-items:center;gap:8px;padding:4px 6px 4px 14px;padding-top:max(4px,env(safe-area-inset-top));background:var(--panel);border-bottom:1px solid var(--line);min-height:56px}
header b{font-size:16px;letter-spacing:.04em;color:var(--acc)}
header .sub{color:var(--mut);font-size:12px;min-width:0;max-width:34vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#saveb svg{display:block;margin:auto}
.lib{display:flex;gap:6px;margin-bottom:6px}.lib .o{flex:1;text-align:left;min-width:0}.lib .o b,.lib .o span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lib .d{min-width:56px;color:var(--bad)}
.sp{flex:1}
button{font:inherit;color:inherit;background:none;border:1px solid var(--line);border-radius:10px;padding:6px 14px;min-height:48px;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
button:active{background:var(--accsoft)}
header button{min-width:48px;min-height:48px;font-size:22px;padding:2px 8px;border:none;border-radius:24px}
button.pri{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:600}
button.pri:active{opacity:.85}
button:disabled{opacity:.4}
#stage{flex:1;position:relative;min-height:120px;overflow:hidden;background:var(--bg)}
#svg{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#hint{position:absolute;left:8px;top:8px;right:8px;pointer-events:none;font-size:12px;color:var(--mut);background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line);border-radius:8px;padding:4px 8px;width:fit-content;max-width:calc(100% - 16px)}
#hint:empty{display:none}
#toast{display:flex;align-items:center;gap:4px;position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 12px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center;z-index:5}
#toast.on{opacity:.97;pointer-events:auto}
#toast button{border:none;min-height:48px;margin:-8px -12px -8px 4px;padding:0 16px;font-weight:700;color:var(--acc2,#7fe0cf);text-transform:uppercase;font-size:13px;letter-spacing:.04em}
@media (prefers-color-scheme:dark){#toast button{color:#0f6b5c}}
#fab{position:absolute;right:10px;bottom:10px;width:48px;height:48px;min-height:48px;padding:0;border-radius:24px;background:var(--panel);box-shadow:0 2px 8px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;color:var(--ink)}
#fab svg{width:24px;height:24px}
#ctx{position:absolute;left:10px;bottom:10px;display:flex;gap:8px}
#ctx[hidden]{display:none}
#ctx button{background:var(--panel);box-shadow:0 2px 8px rgba(0,0,0,.25);border-radius:24px;padding:0 16px;font-weight:600}
#ctx .del{color:var(--bad)}
#empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;pointer-events:none}
#empty[hidden]{display:none}
#empty .card{pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;max-width:340px;text-align:center;box-shadow:0 2px 12px rgba(0,0,0,.12)}
#empty h3{margin:0 0 6px;font-size:18px}
#empty p{margin:0 0 14px;color:var(--mut)}
#empty button{width:100%;margin-top:8px}
#tools{display:flex;background:var(--panel);border-top:1px solid var(--line);padding:4px 4px 4px;gap:2px;overflow-x:auto;scrollbar-width:none}
#tools button{flex:1 0 48px;min-width:48px;border:none;border-radius:10px;padding:3px 0 2px;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:12px;color:var(--mut)}
#tools button svg{width:26px;height:22px}
#tools button.on{background:var(--accsoft);color:var(--ink);outline:1.5px solid var(--acc)}
#tools .div{width:1px;background:var(--line);margin:6px 2px}
#sheet{background:var(--panel);border-top:1px solid var(--line);border-radius:16px 16px 0 0;box-shadow:0 -2px 10px rgba(0,0,0,.12);max-height:46dvh;padding-bottom:env(safe-area-inset-bottom);display:flex;flex-direction:column}
#sheet.col #body{display:none}
#grab{height:24px;display:flex;align-items:center;justify-content:center;touch-action:none;flex:none}
#grab i{width:36px;height:4px;border-radius:2px;background:var(--mut);opacity:.6}
#tabs{display:flex;gap:2px;padding:0 6px 0;border-bottom:1px solid var(--line)}
#tabs button{border:none;border-bottom:2px solid transparent;border-radius:0;color:var(--mut);padding:6px 14px;min-height:48px}
#tabs button.on{color:var(--acc);border-bottom-color:var(--acc);font-weight:600}
#tabs .chev{margin-left:auto;font-size:20px;min-width:48px}
#body{overflow:auto;padding:10px 12px 14px;user-select:text;-webkit-user-select:text;overscroll-behavior:contain}
h4{margin:12px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
h4:first-child{margin-top:0}
.mut{color:var(--mut)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.f{display:flex;flex-direction:column;gap:2px;flex:1 1 90px;min-width:80px}
.f span{font-size:12px;color:var(--mut)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-height:48px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:-1px}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;margin-right:6px;font-weight:600}
.big{font-size:30px;font-weight:700;color:var(--acc);line-height:1.1}
.big small{font-size:14px;font-weight:500;color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:right;padding:5px 4px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{font-size:12px;color:var(--mut);font-weight:600}
tr.best td{background:var(--accsoft);font-weight:600}
.bar{height:8px;background:var(--acc);border-radius:4px;min-width:2px;opacity:.75}
.note{font-size:12px;color:var(--mut);margin:6px 0}
.warn{color:var(--bad)}
.play{display:flex;align-items:center;gap:8px;margin-top:8px}
.play input[type=range]{padding:0;min-height:48px;accent-color:var(--acc);border:none;background:none}
.node text{pointer-events:none;fill:var(--ink)}
.node text.lbl{paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
#report .node text.lbl{stroke:#fff}
.node{cursor:pointer}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
#modal[hidden]{display:none}
#modal .card{background:var(--panel);width:min(560px,100%);max-height:88dvh;overflow:auto;border-radius:14px 14px 0 0;padding:14px;user-select:text;-webkit-user-select:text}
#modal textarea{height:160px;font:12px/1.3 ui-monospace,Consolas,monospace}

#inst{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 14px;background:var(--acc);color:var(--accink);font-size:14px}
#inst[hidden]{display:none}
#inst span{flex:1}
#inst button{min-height:48px;border:none;border-radius:24px;padding:0 18px;font-weight:700;background:var(--accink);color:var(--acc)}
#inst button.x{background:none;color:inherit;padding:0 12px;font-size:20px}

#report{display:none}
@media print{
 html,body{height:auto!important;overflow:visible!important;background:#fff!important;color:#000}
 body{display:block!important;user-select:text}
 body>*:not(#report){display:none!important}
 #report{display:block!important}
}
#report{--bg:#f4f6f8;--panel:#fff;--ink:#16202e;--mut:#5b6778;--line:#c9d1db;--acc:#0f6b5c;--accsoft:#e0f0ec;--accink:#fff;--q:#94540a;--qf:#fbefdc;--n:#2c5aa6;--nf:#e3ecf9;--c:#0f6b5c;--cf:#dcefeb;--f:#7a4aa3;--ff:#eee4f6;--arc:#69758a;--bad:#b3261e;--grid:#e6eaf0;
 font:10.5pt/1.45 Arial,Helvetica,sans-serif;color:#16202e;background:#fff}
#report h1{font-size:20pt;margin:0 0 2pt;color:#0f6b5c}
#report h2{font-size:13pt;margin:16pt 0 6pt;padding-bottom:3pt;border-bottom:1.5pt solid #0f6b5c;break-after:avoid}
#report h3{font-size:10.5pt;margin:10pt 0 4pt;break-after:avoid}
#report p{margin:0 0 6pt}
#report .meta{color:#5b6778;font-size:9.5pt;margin-bottom:8pt}
#report table{width:100%;border-collapse:collapse;font-size:9.5pt;margin:4pt 0 8pt}
#report th,#report td{border:.5pt solid #c9d1db;padding:3pt 5pt;text-align:right}
#report th{background:#e0f0ec;color:#16202e;font-weight:700}
#report td:first-child,#report th:first-child,#report td.l,#report th.l{text-align:left}
#report tr{break-inside:avoid}
#report tr.best td{background:#e0f0ec;font-weight:700}
#report figure{margin:6pt 0;break-inside:avoid}
#report figcaption{font-size:9pt;color:#5b6778;margin-top:3pt}
#report .big{font-size:22pt;font-weight:700;color:#0f6b5c}
#report .box{border:.75pt solid #c9d1db;border-radius:4pt;padding:6pt 8pt;background:#f7f9fb;break-inside:avoid;margin:6pt 0}
#report .leg{display:grid;grid-template-columns:34pt 1fr;gap:4pt 8pt;align-items:center;font-size:9.5pt}
#report .leg svg{width:34pt;height:28pt}
#report .warn{color:#b3261e}
#report .foot{margin-top:14pt;font-size:8.5pt;color:#5b6778;border-top:.5pt solid #c9d1db;padding-top:4pt}
@page{margin:14mm;@bottom-center{content:"Page " counter(page) " of " counter(pages);font-size:8pt;color:#5b6778}}

#watch{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
#watch[hidden]{display:none}
#watch .wbar{display:flex;align-items:center;gap:8px;padding:4px 6px;background:var(--panel);border-bottom:1px solid var(--line)}
#watch .wbar button{min-width:48px;border:none;font-size:22px;border-radius:24px}
#watch .wt{flex:1;min-width:0}#watch .wt b{display:block;font-size:18px}#watch .wt span{display:block;font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#watch .wstage{flex:1;min-height:0;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
#wsvg{width:100%;height:100%;display:block}
#watch .wctl{background:var(--panel);border-top:1px solid var(--line);padding:6px 10px 8px}
#watch .wrow{display:flex;align-items:center;gap:8px}
#watch .wrow button{min-height:48px}
#wplay{min-width:56px;border-radius:28px;font-size:20px}
#wscrub{flex:1;min-height:48px;padding:0}
#watch .wspd button{padding:0 12px;min-width:48px;font-size:13px}
#watch .wspd button.on{border-color:var(--acc);background:var(--accsoft);font-weight:700}
#wsvg .node.pop{animation:wpop .5s ease-out;transform-box:fill-box;transform-origin:center}
@keyframes wpop{0%{transform:scale(1)}35%{transform:scale(1.22)}100%{transform:scale(1)}}
#wsvg line.flow{stroke-dasharray:7 5;animation:wdash .7s linear infinite;stroke:var(--acc)}
@keyframes wdash{to{stroke-dashoffset:-12}}
</style>
</head>
<body>
<div id="inst" hidden><span id="instT">Install CYCLONE on this device</span><button id="instB">Install</button><button class="x" id="instX" aria-label="Dismiss">✕</button></div>
<header role="banner">
  <b>CYCLONE</b><span class="sub">network simulator</span><span class="sp"></span>
  <button id="saveb" aria-label="Save network" title="Save"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M5 3h12l3 3v15H5z"/><path d="M8 3v6h8V3M8 21v-7h8v7"/></svg></button>
  <button id="undo" aria-label="Undo last change" title="Undo">↶</button>
  <button id="menu" aria-label="Menu: examples, new network, import and export" aria-haspopup="dialog">⋯</button>
</header>
<div id="stage">
  <svg id="svg" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Network diagram canvas. Drag to pan, pinch to zoom, tap a node to edit.">
    <defs>
      <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="var(--grid)" stroke-width="1"/></pattern>
      <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="var(--arc)"/></marker>
      <marker id="ahs" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" orient="auto"><path d="M0,0L10,5L0,10z" fill="var(--acc)"/></marker>
    </defs>
    <rect id="bg" x="-20000" y="-20000" width="40000" height="40000" fill="url(#grid)"/>
    <g id="world"></g>
  </svg>
  <div id="hint"></div>
  <div id="empty" hidden><div class="card"><h3>Build your first network</h3><p>Start from a worked example, or place a queue and build from scratch.</p><button class="pri" id="emEx">Load an example</button><button id="emNew">Add a Queue</button></div></div>
  <div id="ctx" hidden><button id="cLink">Link from here</button><button id="cDel" class="del">Delete</button></div>
  <button id="fab" aria-label="Fit diagram to screen"><svg viewBox="0 0 26 22"><path d="M4 8V4h4M18 4h4v4M22 14v4h-4M8 18H4v-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <div id="toast" role="status" aria-live="polite"></div>
</div>
<nav id="tools" aria-label="Diagram tools">
  <button data-tool="select" class="on"><svg viewBox="0 0 26 22"><path d="M8 3l11 8-5 1 3 6-3 1-3-6-4 3z" fill="currentColor"/></svg>Select</button>
  <button data-tool="link"><svg viewBox="0 0 26 22"><path d="M3 16h17M15 10l6 6-6 6" transform="translate(0 -5)" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>Link</button>
  <span class="div"></span>
  <button data-add="queue"><svg viewBox="0 0 26 22"><circle cx="12" cy="10" r="7.5" fill="var(--qf)" stroke="var(--q)" stroke-width="2.2"/><path d="M17 15l4 4" stroke="var(--q)" stroke-width="2.2" stroke-linecap="round"/></svg>Queue</button>
  <button data-add="combi"><svg viewBox="0 0 26 22"><rect x="3" y="4" width="20" height="14" rx="1" fill="var(--cf)" stroke="var(--c)" stroke-width="2.2"/><path d="M3 11l7-7" stroke="var(--c)" stroke-width="2.2"/></svg>Combi</button>
  <button data-add="normal"><svg viewBox="0 0 26 22"><rect x="3" y="4" width="20" height="14" rx="1" fill="var(--nf)" stroke="var(--n)" stroke-width="2.2"/></svg>Normal</button>
  <button data-add="func"><svg viewBox="0 0 26 22"><circle cx="12" cy="15" r="6" fill="var(--ff)" stroke="var(--f)" stroke-width="2.2"/><path d="M12 9V1l8 3-8 3" fill="var(--f)" stroke="var(--f)" stroke-width="1.2" stroke-linejoin="round"/></svg>Counter</button><button data-add="con"><svg viewBox="0 0 26 22"><circle cx="13" cy="11" r="7.5" fill="var(--ff)" stroke="var(--f)" stroke-width="2.2"/></svg>CON</button>
</nav>
<section id="sheet">
  <div id="grab" aria-hidden="true"><i></i></div>
  <div id="tabs" role="tablist">
    <button data-tab="edit" class="on">Edit</button>
    <button data-tab="run">Run</button>
    <button data-tab="res">Results</button>
    <button class="chev" id="chev" aria-label="Collapse or expand panel" aria-expanded="true">⌄</button>
  </div>
  <div id="body"></div>
</section>
<div id="report" aria-hidden="true"></div>
<div id="watch" role="dialog" aria-modal="true" aria-label="Simulation replay" hidden><div class="wbar"><button id="wx" aria-label="Close replay">✕</button><div class="wt"><b id="wclock"></b><span id="wprod"></span></div></div><div class="wstage"><svg id="wsvg" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Animated network diagram"><defs><marker id="wah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="var(--arc)"/></marker></defs><g id="wworld"></g></svg></div><div class="wctl"><div class="wrow"><button id="wplay" aria-label="Play or pause">❚❚</button><input id="wscrub" type="range" min="0" max="1" step="any" value="0" aria-label="Simulation time"></div><div class="wrow wspd" style="margin-top:4px"><span class="mut" style="font-size:13px">Speed</span></div></div></div>
<div id="modal" hidden role="dialog" aria-modal="true" aria-label="Menu"><div class="card" id="modalcard"></div></div>

<script>
//ENGINE-START
function rng(seed){let s=seed>>>0;return()=>{s=(s+0x6D2B79F5)>>>0;let t=s;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;};}
function sample(n,r){
  switch(n.dist){
    case'fixed':return Math.max(0,n.a);
    case'tri':{let a=n.a,m=n.b,c=n.c;if(c<a)[a,c]=[c,a];m=Math.min(Math.max(m,a),c);if(c-a<1e-12)return Math.max(0,a);
      const u=r(),f=(m-a)/(c-a);return u<f?a+Math.sqrt(u*(c-a)*(m-a)):c-Math.sqrt((1-u)*(c-a)*(c-m));}
    case'uni':{const lo=Math.min(n.a,n.b),hi=Math.max(n.a,n.b);return Math.max(0,lo+(hi-lo)*r());}
    case'norm':{const u=r()||1e-12,v=r();return Math.max(0,n.a+n.b*Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v));}
    case'exp':return -Math.max(0,n.a)*Math.log(1-r());
  }
  return 0;
}
// CYCLONE semantics (Halpin, Ch. 20): Queue = idle state. Combi = starts when every feeding queue has a unit (lower number wins ties).
// Normal = starts when a unit arrives. Counter = counts units passing. CON n = n units in, 1 out. Queue GEN n = 1 unit in, n units in the queue.
function simulate(m,seed,trace){
  const r=rng(seed),S=m.settings,nodes=m.nodes,byId=new Map(nodes.map(n=>[n.id,n]));
  const out=new Map(),inn=new Map();nodes.forEach(n=>{out.set(n.id,[]);inn.set(n.id,[]);});
  const seenArc=new Set();m.arcs.forEach(a=>{const key=a.from+'>'+a.to;if(out.has(a.from)&&inn.has(a.to)&&!seenArc.has(key)){seenArc.add(key);out.get(a.from).push(a.to);inn.get(a.to).push(a.from);}});
  const byNum=(a,b)=>(a.num-b.num)||(a.id-b.id);
  const combis=nodes.filter(n=>n.type==='combi').sort(byNum);
  const mainC=nodes.filter(n=>n.type==='func').sort(byNum)[0]||null;
  const stopN=(S.stopMode==='count'&&mainC)?Math.max(1,Math.round(S.cycles)):0,T0=S.horizon;
  const gen=n=>Math.max(1,Math.round(n.gen||1)),kk=n=>Math.max(1,Math.round(n.k||1));
  const st=new Map();nodes.forEach(n=>{const q0=n.type==='queue'?Math.max(0,Math.round(n.init))*gen(n):0;st.set(n.id,{q:q0,act:0,cnt:0,acc:0,starts:0,dep:0,area:0,ne:0,last:0,max:q0});});
  const upd=(s,f,t,d)=>{const dt=t-s.last;if(f==='q'){s.area+=s.q*dt;if(s.q>0)s.ne+=dt;}else s.area+=s.act*dt;s.last=t;s[f]+=d;if(f==='q'&&s.q>s.max)s.max=s.q;};
  const heap=[];let seq=0;
  const less=(a,b)=>a.t<b.t||(a.t===b.t&&a.seq<b.seq);
  const push=e=>{heap.push(e);let i=heap.length-1;while(i>0){const p=(i-1)>>1;if(!less(heap[i],heap[p]))break;[heap[p],heap[i]]=[heap[i],heap[p]];i=p;}};
  const pop=()=>{const top=heap[0],last=heap.pop();if(heap.length){heap[0]=last;let i=0;for(;;){const l=2*i+1,rr=l+1;let s=i;if(l<heap.length&&less(heap[l],heap[s]))s=l;if(rr<heap.length&&less(heap[rr],heap[s]))s=rr;if(s===i)break;[heap[s],heap[i]]=[heap[i],heap[s]];i=s;}}return top;};
  let started=0;const LIMIT=400000;
  const startTask=(n,t0)=>{const s=st.get(n.id);upd(s,'act',t0,1);s.starts++;started++;let d=sample(n,r);if(!(d>0))d=0;push({t:t0+d,seq:seq++,id:n.id});};
  const arrive=(id,t0,depth)=>{const n=byId.get(id),s=st.get(id);
    if(n.type==='queue')upd(s,'q',t0,gen(n));
    else if(n.type==='normal'){if(started<LIMIT)startTask(n,t0);}
    else if(n.type==='func'){s.cnt++;if(n===mainC&&trace)trace.c.push(t0);if(depth<40)out.get(id).forEach(o=>arrive(o,t0,depth+1));}
    else if(n.type==='con'){s.acc++;if(s.acc>=kk(n)){s.acc-=kk(n);s.cnt++;if(depth<40)out.get(id).forEach(o=>arrive(o,t0,depth+1));}}};
  const tryCombis=t0=>{while(started<LIMIT){let go=null;for(const n of combis){const ins=inn.get(n.id);if(ins.length&&ins.every(q=>st.get(q).q>=1)){go=n;break;}}
    if(!go)return;inn.get(go.id).forEach(q=>{const s=st.get(q);upd(s,'q',t0,-1);s.dep++;});startTask(go,t0);}};
  const snap=t0=>{if(!trace||trace.t.length>=6000)return;trace.t.push(t0);trace.v.push(nodes.map(n=>{const s=st.get(n.id);return n.type==='queue'?[s.q,0]:n.type==='func'?[s.cnt,0]:n.type==='con'?[s.acc,0]:[s.act,0];}));};
  const hit=()=>stopN&&st.get(mainC.id).cnt>=stopN;
  let T=T0,done=!stopN,lastT=0,capped=false;
  tryCombis(0);snap(0);
  if(hit()){T=1e-9;done=true;}
  else while(heap.length&&started<LIMIT){if(heap[0].t>T0)break;const e=pop(),t=e.t,s=st.get(e.id);lastT=t;upd(s,'act',t,-1);out.get(e.id).forEach(o=>arrive(o,t,0));tryCombis(t);snap(t);if(hit()){T=t;done=true;break;}}
  if(!(T>0))T=1e-9;
  if(started>=LIMIT){capped=true;done=false;T=Math.max(Math.min(T0,lastT),1e-9);}
  nodes.forEach(n=>{const s=st.get(n.id);upd(s,n.type==='queue'?'q':'act',T,0);});
  return{st,T,done,capped};
}

function nodeSvg(n,i){
  const k=SUF[n.type],c=`var(--${k})`,cf=`var(--${k}f)`,lv=liveVal(i),isSel=sel&&sel.t==='n'&&sel.id===n.id,isLink=linkFrom===n.id;

    if(ring)s+=`<rect x="${n.x-61}" y="${n.y-31}" width="122" height="62" rx="6" ${ring}/>`;
    s+=`<rect x="${n.x-54}" y="${n.y-24}" width="108" height="48" rx="2" fill="${busy?c:cf}" fill-opacity="${busy?.28:1}" stroke="${c}" stroke-width="2.5"/>`;
    if(comb)s+=`<line x1="${n.x-54}" y1="${n.y-6}" x2="${n.x-36}" y2="${n.y-24}" stroke="${c}" stroke-width="2.5"/>`;
    s+=T(n.x,n.y+4,esc(n.name.slice(0,14)),13,600)+`<text x="${n.x+50}" y="${n.y-14}" text-anchor="end" dominant-baseline="central" font-size="12" ${mut}>${n.num}</text>`;
    s+=T(n.x,n.y+39,esc(distText(n)),11,400,mut+' class="lbl"');
    if(lv!==null&&lv>0)s+=`<circle cx="${n.x+54}" cy="${n.y-24}" r="11" fill="var(--acc)"/>`+T(n.x+54,n.y-24,lv,12,700,'style="fill:var(--accink)"');
  }
  return s+'</g>';
}
function render(){

  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;model.nodes.forEach(n=>{x0=Math.min(x0,n.x-70);x1=Math.max(x1,n.x+70);y0=Math.min(y0,n.y-45);y1=Math.max(y1,n.y+65);});
  const k=Math.max(.25,Math.min(r.width/(x1-x0),r.height/(y1-y0),1.5));
  view.k=k;view.x=(r.width-(x1-x0)*k)/2-x0*k;view.y=(r.height-(y1-y0)*k)/2-y0*k;apply();}

function addNode(type){buzz();pushUndo();const r=svg.getBoundingClientRect(),c=toWorld(r.left+r.width/2,r.top+r.height/2),j=(model.nodes.length%6)*16;

function tryLink(fid,tid){const A=nodeById(fid),B=nodeById(tid);
  if(fid===tid)return toast('Choose a different node');
  if(model.arcs.some(a=>a.from===fid&&a.to===tid))return toast('Those nodes are already linked');
  if(A.type==='queue'&&B.type!=='combi')return toast('A queue can only feed a Combi task');
  if(B.type==='combi'&&A.type!=='queue')return toast('A Combi task can only be fed by queues');
  if(B.type==='queue'&&A.type==='queue')return toast('Queues cannot link to queues');
  pushUndo();model.arcs.push({id:model.aid++,from:fid,to:tid});invalidate();toast(`${A.name} → ${B.name}`);}
function setTool(t){tool=t;linkFrom=null;document.querySelectorAll('#tools [data-tool]').forEach(b=>{const on=b.dataset.tool===t;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on);});render();}

/* ---------- pointer handling ---------- */
const pts=new Map();let drag=null,pinch=null;
svg.addEventListener('pointerdown',e=>{svg.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===2){const [p,q]=[...pts.values()],r=svg.getBoundingClientRect();const cx=(p.x+q.x)/2-r.left,cy=(p.y+q.y)/2-r.top;
    pinch={d:Math.hypot(p.x-q.x,p.y-q.y),k:view.k,wx:(cx-view.x)/view.k,wy:(cy-view.y)/view.k};drag=null;return;}
  const t=e.target.closest('[data-n],[data-a]'),w=toWorld(e.clientX,e.clientY);
  if(t&&t.dataset.n){const n=nodeById(+t.dataset.n);drag={m:'node',n,ox:w.x-n.x,oy:w.y-n.y,sx:e.clientX,sy:e.clientY,moved:false,undone:false};}
  else if(t&&t.dataset.a)drag={m:'arc',id:+t.dataset.a,sx:e.clientX,sy:e.clientY,moved:false};
  else drag={m:'pan',sx:e.clientX,sy:e.clientY,vx:view.x,vy:view.y,moved:false};});
svg.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch&&pts.size>=2){const [p,q]=[...pts.values()],r=svg.getBoundingClientRect();const cx=(p.x+q.x)/2-r.left,cy=(p.y+q.y)/2-r.top;
    view.k=Math.min(3,Math.max(.2,pinch.k*Math.hypot(p.x-q.x,p.y-q.y)/pinch.d));view.x=cx-pinch.wx*view.k;view.y=cy-pinch.wy*view.k;apply();return;}
  if(!drag)return;const dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;
  if(!drag.moved&&Math.hypot(dx,dy)>6)drag.moved=true;if(!drag.moved)return;
  if(drag.m==='pan'){view.x=drag.vx+dx;view.y=drag.vy+dy;apply();}
  if(drag.m==='node'&&tool==='select'){if(!drag.undone){pushUndo();drag.undone=true;}const w=toWorld(e.clientX,e.clientY);drag.n.x=Math.round((w.x-drag.ox)/5)*5;drag.n.y=Math.round((w.y-drag.oy)/5)*5;render();}});
function endPtr(e){if(!pts.has(e.pointerId))return;pts.delete(e.pointerId);if(pinch){if(pts.size<2)pinch=null;drag=null;return;}
  const d=drag;drag=null;if(!d)return;
  if(d.moved){if(d.m==='node'){invalidate();save();}return;}
  if(d.m==='node'){const n=d.n;
    if(tool==='delete'){delNode(n.id);render();save();renderTab();}
    else if(tool==='link'){if(!linkFrom){linkFrom=n.id;render();}else{const f=linkFrom;linkFrom=null;tryLink(f,n.id);render();save();}}
    else{sel={t:'n',id:n.id};setTab('edit',true);render();}}
  else if(d.m==='arc'){if(tool==='delete'){delArc(d.id);render();save();}else{sel={t:'a',id:d.id};setTab('edit',true);render();}}
  else{sel=null;linkFrom=null;render();renderTab();}}
svg.addEventListener('pointerup',endPtr);svg.addEventListener('pointercancel',endPtr);
svg.addEventListener('wheel',e=>{e.preventDefault();const r=svg.getBoundingClientRect(),cx=e.clientX-r.left,cy=e.clientY-r.top,wx=(cx-view.x)/view.k,wy=(cy-view.y)/view.k;
  view.k=Math.min(3,Math.max(.2,view.k*(e.deltaY<0?1.12:1/1.12)));view.x=cx-wx*view.k;view.y=cy-wy*view.k;apply();},{passive:false});
window.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select'))return;if((e.key==='Delete'||e.key==='Backspace')&&sel){sel.t==='n'?delNode(sel.id):delArc(sel.id);render();save();renderTab();}});

function setTab(t,open){if(t!==tab)body.scrollTop=0;tab=t;if(open)$('#sheet').classList.remove('col');document.querySelectorAll('#tabs [data-tab]').forEach(b=>{b.classList.toggle('on',b.dataset.tab===t);b.setAttribute('role','tab');b.setAttribute('aria-selected',b.dataset.tab===t);});renderTab();}
function renderTab(){body.innerHTML=tab==='edit'?tabEdit():tab==='run'?tabRun():tabRes();if(tab==='run')syncPlay();}
const fld=(label,p,val,extra='')=>`<label class="f"><span>${label}</span>${extra.includes('text')?`<input data-p="${p}" type="text" inputmode="text" autocapitalize="sentences" autocomplete="off" enterkeyhint="done" value="${esc(val)}">`:`<input data-p="${p}" type="number" inputmode="decimal" enterkeyhint="done" step="any" value="${esc(val)}">`}</label>`;
const DISTS={fixed:['Fixed','Value'],tri:['Triangular','Min','Most likely','Max'],uni:['Uniform','Min','Max'],norm:['Normal','Mean','Std dev'],exp:['Exponential','Mean']};
function tabEdit(){
  if(!sel){return`<h4>Getting started</h4><p class="mut" style="margin:0 0 6px">Tap a node to edit it, drag to move it, drag the background to pan, pinch to zoom.</p>
    <p class="mut" style="margin:0 0 6px">Use <b>Link</b> to draw arrows. Queues feed Combi tasks, tasks pass units on, and the Counter measures production.</p>
    <p class="mut" style="margin:0">Open <b>⋯</b> for the examples from Halpin, Chapter 20, then use the <b>Run</b> tab.</p>`;}
  if(sel.t==='a'){const a=model.arcs.find(x=>x.id===sel.id);if(!a){sel=null;return tabEdit();}const A=nodeById(a.from),B=nodeById(a.to);
    return`<h4>Arrow</h4><p style="margin:0 0 10px"><b>${esc(A.name)}</b> → <b>${esc(B.name)}</b></p><button data-do="delarc" class="warn">Delete arrow</button>`;}
  const n=nodeById(sel.id);if(!n){sel=null;return tabEdit();}
  let h=`<h4><span class="tag" style="background:var(--${SUF[n.type]}f);color:var(--${SUF[n.type]})">${TNAME[n.type]}</span></h4><p class="note" style="margin-top:0">${HELP[n.type]}</p><div class="row">${fld('Name','n.name',n.name,'text')}${fld(n.type==='combi'?'No. (priority)':'No.','n.num',n.num)}`;
  if(n.type==='queue')h+=fld('Units at start','n.init',n.init)+fld('GEN (per arrival)','n.gen',n.gen||1);
  if(n.type==='con')h+=fld('Units to consolidate (n)','n.k',n.k||1);
  h+='</div>';
  if(n.type==='combi'||n.type==='normal'){const D=DISTS[n.dist];
    h+=`<h4>Duration (${esc(model.settings.tunit)})</h4><div class="row"><label class="f" style="flex-basis:140px"><span>Distribution</span><select data-p="n.dist">${Object.entries(DISTS).map(([k,v])=>`<option value="${k}" ${k===n.dist?'selected':''}>${v[0]}</option>`).join('')}</select></label>`;
    D.slice(1).forEach((l,i)=>{h+=fld(l,'n.'+'abc'[i],n['abc'[i]]);});h+='</div>';}

function tabRun(){const S=model.settings,cnt=S.stopMode==='count';

  ${cnt?fld('Cycles (N)','s.cycles',S.cycles):''}${fld(cnt?'Time limit (safety)':'Simulated time','s.horizon',S.horizon)}<label class="f"><span>Time unit</span><select data-p="s.tunit">${['min','h','s','day'].map(u=>`<option ${u===S.tunit?'selected':''}>${u}</option>`).join('')}</select></label>${fld('Runs','s.reps',S.reps)}${fld('Random seed','s.seed',S.seed)}</div>
  <div class="row" style="margin-top:8px">${fld('Quantity per count','s.load',S.load)}${fld('Quantity unit','s.unit',S.unit,'text')}</div>
  <div style="margin-top:12px;display:flex;gap:8px"><button class="pri" data-do="run" style="flex:1">Run simulation</button><button data-do="settings">Settings…</button></div>
  <div id="playbox" ${trace?'':'hidden'}><h4>Replay (first run)</h4><button data-do="watch" class="pri" style="width:100%;margin-bottom:8px">▶ Watch full screen</button><div class="play"><button data-do="play" id="playbtn" style="min-width:44px">${playing?'❚❚':'▶'}</button><input id="scrub" type="range" min="0" max="${playEnd()}" step="any" value="${playT}" style="flex:1"><span id="plab" class="mut" style="min-width:68px;text-align:right"></span></div>

const playEnd=()=>trace?trace.t[trace.t.length-1]:model.settings.horizon;
function syncPlay(){const s=$('#scrub');if(!s||!trace)return;s.value=playT;$('#plab').textContent=`${fmt(playT,1)} ${model.settings.tunit}`;$('#playbtn').textContent=playing?'❚❚':'▶';}
function curveSvg(cv){const W=320,H=110,pl=34,pb=18,pt=6,pr=6,N=cv.N,T=cv.T||1;
  const X=t=>pl+(t/T)*(W-pl-pr),Y=i=>H-pb-(i/N)*(H-pb-pt);
  let pts=`${X(0)},${Y(0)}`;cv.pts.forEach(q=>{pts+=` ${X(q[0])},${Y(q[1])}`;});
  return`<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:420px;display:block"><line x1="${pl}" y1="${H-pb}" x2="${W-pr}" y2="${H-pb}" stroke="var(--line)"/><line x1="${pl}" y1="${pt}" x2="${pl}" y2="${H-pb}" stroke="var(--line)"/>
  <polyline points="${pts}" fill="none" stroke="var(--acc)" stroke-width="2" stroke-linejoin="round"/>
  <text x="${pl-4}" y="${pt+6}" text-anchor="end" font-size="10" style="fill:var(--mut)">${N}</text><text x="${pl-4}" y="${H-pb}" text-anchor="end" font-size="10" style="fill:var(--mut)">0</text>
  <text x="${pl}" y="${H-4}" font-size="10" style="fill:var(--mut)">0</text><text x="${W-pr}" y="${H-4}" text-anchor="end" font-size="10" style="fill:var(--mut)">${fmt(T,0)} ${esc(model.settings.tunit)}</text></svg>`;}
function tabRes(){const R=results,O=ov(R?R.S:model.settings,R?R.per:(PER[model.settings.tunit]||'hour'));let h=R?'<div class="row" style="margin:0 0 8px"><button data-do="pdf" class="pri" style="flex:1">Export PDF report…</button><button data-do="csv" style="flex:1">Copy for Excel (CSV)</button></div>':'';
  if(!R)h+=`<p class="mut" style="margin:0 0 4px">No results yet. Open the <b>Run</b> tab and tap Run simulation.</p>`;
  else{const S=R.S;
    if(R.stale)h+=`<p class="warn note" style="margin-top:0">The model was edited after this run. Run again to refresh these results.</p>`;
    if(R.capped)h+=`<p class="warn note">${R.capped} run${R.capped>1?'s':''} stopped at the safety limit of 400,000 task starts, so the results cover only the time actually simulated (about ${fmt(R.Tavg,1)} ${esc(S.tunit)}).</p>`;
    if(R.counters.length){const c0=R.counters[0];h+=`<div class="big">${fmt(c0.rate.m*O.k,O.d)} <small>${esc(O.u)}/${O.per}</small></div><div class="mut">${fmt(c0.perT*O.kT,4)} ${esc(O.u)}/${esc(S.tunit)} ${R.reps>1?` · ± ${fmt(c0.rate.ci*O.k,O.d)} (95%)`:''} · ${esc(c0.name)}</div>${O.note?`<div class="mut">${esc(O.note)}</div>`:''}
      <div class="mut">${R.reps} run${R.reps>1?'s':''} · ${fmt(R.Tavg,1)} ${esc(S.tunit)} simulated · ${fmt(c0.cyc,2)} ${esc(S.tunit)} per count</div>`;
      if(R.incomplete)h+=`<p class="warn note">${R.incomplete} run${R.incomplete>1?'s':''} reached the time limit before ${S.cycles} cycles.</p>`;
      if(R.curve)h+=`<h4>Cumulative count (first run)</h4>${curveSvg(R.curve)}`;}
    else h+=`<p class="warn">Add a Counter node after the last activity so production can be measured.</p>`;
    if(R.counters.length>1||R.counters.length){h+=`<h4>Counters</h4><table><tr><th>Counter</th><th>Count / run</th><th>${esc(O.u)} / ${O.per}</th></tr>${R.counters.map(c=>`<tr><td>${c.num} ${esc(c.name)}</td><td>${fmt(c.cnt.m,1)}</td><td>${fmt(c.rate.m*O.k,O.d)}</td></tr>`).join('')}</table>`;}
    h+=`<h4>Activities</h4><table><tr><th>Task</th><th>Starts / run</th><th>Avg busy</th></tr>${R.tasks.map(t=>`<tr><td>${t.num} ${esc(t.name)}</td><td>${fmt(t.starts,1)}</td><td>${fmt(t.busy,2)}${t.type==='combi'&&t.busy<=1?` (${fmt(t.busy*100,0)}%)`:''}</td></tr>`).join('')}</table>`;
    h+=`<h4>Queues (idle units)</h4><table style="font-size:12px"><tr><th>Queue</th><th>Avg</th><th>Max</th><th>% not empty</th><th>Avg wait</th><th>At end</th></tr>${R.queues.map(q=>`<tr><td>${q.num} ${esc(q.name)}</td><td>${fmt(q.len,2)}</td><td>${fmt(q.max,0)}</td><td>${fmt(q.ne,1)}</td><td>${fmt(q.wait,1)}</td><td>${fmt(q.end,0)}</td></tr>`).join('')}</table><p class="note">Wait is in ${esc(S.tunit)}.</p>`;
    (R.insights||[]).forEach(t=>{h+=`<p class="note">${t}</p>`;});}
  const qs=model.nodes.filter(n=>n.type==='queue');
  h+=`<h4>Fleet sweep</h4>`;
  if(!qs.length)h+=`<p class="note">Add a queue to compare different numbers of resources.</p>`;
  else{h+=`<p class="note" style="margin-top:0">Re-runs the model with different starting units in one queue, e.g. 1 to 12 trucks, to find how many are enough.</p><div class="row"><label class="f" style="flex-basis:150px"><span>Queue</span><select id="swq">${qs.map(q=>`<option value="${q.id}" ${sweepSel===q.id?'selected':''}>${q.num} ${esc(q.name)}</option>`).join('')}</select></label><label class="f"><span>From</span><input id="swa" type="number" value="${sweepA}"></label><label class="f"><span>To</span><input id="swb" type="number" value="${sweepB}"></label></div>
    <div style="margin-top:8px"><button data-do="sweep">Run sweep</button></div>`;
    if(sweepRows){const mx=Math.max(...sweepRows.map(r=>r.rate)),best=sweepRows.find(r=>r.rate>=.95*mx);
      h+=`<table style="margin-top:8px"><tr><th>Units</th><th>${esc(O.u)}/${O.per}</th><th style="width:40%"></th><th>Gain</th></tr>${sweepRows.map((r,i)=>`<tr class="${r===best?'best':''}"><td>${r.v}${r===best?' ★':''}</td><td>${fmt(r.rate*O.k,O.d)}</td><td><div class="bar" style="width:${mx>0?r.rate/mx*100:0}%"></div></td><td>${i?`${r.rate-sweepRows[i-1].rate>=0?'+':''}${fmt((r.rate-sweepRows[i-1].rate)*O.k,O.d)}`:'–'}</td></tr>`).join('')}</table><p class="note">★ is the smallest number reaching 95% of the best result. More units beyond that add little.</p>`;}}
  return h;}

/* ---------- run, stats, replay ---------- */
const mean=a=>a.reduce((s,x)=>s+x,0)/(a.length||1);
const sd=a=>{if(a.length<2)return 0;const m=mean(a);return Math.sqrt(a.reduce((s,x)=>s+(x-m)**2,0)/(a.length-1));};
const agg=a=>({m:mean(a),sd:sd(a),ci:1.96*sd(a)/Math.sqrt(a.length||1)});
function checkModel(){const m=model;
  if(!m.nodes.some(n=>n.type==='combi'))return'Add at least one Combi task (for example Load).';
  if(m.settings.stopMode==='count'&&!m.nodes.some(n=>n.type==='func'))return'Add a Counter, or stop on a time limit instead.';
  const bad=m.nodes.find(n=>(n.type==='combi'||n.type==='normal')&&n.dist==='tri'&&!(n.a<=n.c));if(bad)return`“${bad.name}”: the triangular minimum must not exceed the maximum.`;
  const c=m.nodes.find(n=>n.type==='combi'&&!m.arcs.some(a=>a.to===n.id));if(c)return`“${c.name}” has no queue feeding it.`;
  return null;}
function runModel(m,reps,wantTrace){const S=m.settings,tf=TF[S.tunit]||60,runs=[];let tr=null;
  for(let i=0;i<reps;i++){let t=null;if(wantTrace&&i===0)t=tr={t:[],v:[],c:[]};runs.push(simulate(m,(S.seed|0)+i*101,t));}
  return{runs,tr,tf};}
const tick=()=>new Promise(r=>setTimeout(r,0));
async function runAll(){const err=checkModel();if(err)return toast(err);
  const S={...model.settings};S.reps=Math.max(1,Math.min(500,Math.round(S.reps)));const btn=document.querySelector('[data-do=run]');btn.disabled=true;btn.textContent='Running…';await tick();
  const{runs,tr,tf}=runModel(model,S.reps,true),Ts=runs.map(r=>r.T);
  if(Ts.some(t=>!(t>1e-6))){toast('The counter was reached instantly. Check that the durations are not all zero.');renderTab();return;}
  const res={S,reps:S.reps,Tavg:mean(Ts),capped:runs.filter(r=>r.capped).length,incomplete:S.stopMode==='count'?runs.filter(r=>!r.done).length:0,per:PER[S.tunit]||'hour',counters:[],tasks:[],queues:[],insights:[],curve:null};
  [...model.nodes].sort(byNumU).forEach(n=>{const ss=runs.map(r=>r.st.get(n.id));
    if(n.type==='func'){res.counters.push({num:n.num,name:n.name,cnt:agg(ss.map(s=>s.cnt)),rate:agg(ss.map((s,i)=>s.cnt*S.load/(Ts[i]/tf))),perT:mean(ss.map((s,i)=>s.cnt*S.load/Ts[i])),cyc:mean(ss.map((s,i)=>s.cnt?Ts[i]/s.cnt:NaN))});}
    else if(n.type==='queue'){res.queues.push({id:n.id,num:n.num,name:n.name,len:mean(ss.map((s,i)=>s.area/Ts[i])),max:mean(ss.map(s=>s.max)),ne:mean(ss.map((s,i)=>s.ne/Ts[i]*100)),wait:mean(ss.map(s=>s.dep?s.area/s.dep:0)),end:mean(ss.map(s=>s.q))});}
    else if(n.type==='combi'||n.type==='normal')res.tasks.push({num:n.num,name:n.name,type:n.type,starts:mean(ss.map(s=>s.starts)),busy:mean(ss.map((s,i)=>s.area/Ts[i]))});});
  model.nodes.filter(n=>n.type==='combi').forEach(c=>{const ins=res.queues.filter(q=>model.arcs.some(a=>a.from===q.id&&a.to===c.id));
    if(ins.length>1){const lo=[...ins].sort((a,b)=>a.len-b.len),a=lo[0],b=lo[lo.length-1];
      if(a.len<.5&&b.len>1)res.insights.push(`At <b>${esc(c.name)}</b>, “${esc(a.name)}” is almost always empty (avg ${fmt(a.len,2)}) while “${esc(b.name)}” averages ${fmt(b.len,1)}. The first is the bottleneck and the second is in surplus.`);
      else if(a.len>=.5)res.insights.push(`At <b>${esc(c.name)}</b>, every feeding queue usually holds units, so the task itself limits the rate.`);}});

  const p=24,x=bb.x-p,y=bb.y-p,W=bb.width+2*p,H=bb.height+2*p;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${x} ${y} ${W} ${H}" style="width:100%;height:auto;max-height:${W>H*1.2?'150':'200'}mm;border:.5pt solid #c9d1db;background:#fff">
   <defs><marker id="rah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#69758a"/></marker><marker id="rahs" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="#0f6b5c"/></marker></defs>${inner}</svg>`;}
function reportLegend(){
  const ic=sel=>{const e=document.querySelector(sel+' svg');return e?e.outerHTML:'';};
  const r=[[ic('#tools [data-add=queue]'),'<b>Queue</b> (circle with a tick): idle units waiting, such as trucks or a loader. The number inside is the starting count. GEN n turns each arriving unit into n units.'],
   [ic('#tools [data-add=combi]'),'<b>Combi task</b> (square with a corner slash): starts only when every queue feeding it holds a unit. If tasks compete, the lower node number goes first.'],
   [ic('#tools [data-add=normal]'),'<b>Normal task</b> (plain square): starts as soon as a unit arrives, with no waiting condition.'],
   [ic('#tools [data-add=func]'),'<b>Counter</b> (circle with a flag): counts the units passing and measures production.'],
   [ic('#tools [data-add=con]'),'<b>CON n</b> (plain circle): consolidates n arriving units into one.'],
   [ic('#tools [data-tool=link]'),'<b>Arrow</b>: the direction units move. Queues feed Combi tasks, and tasks pass units on.']];
  return `<div class="leg">${r.map(x=>`<div>${x[0]}</div><div>${x[1]}</div>`).join('')}</div><p style="margin-top:6pt;font-size:9pt;color:#5b6778">Small numbers at the corner of a node are node numbers. Text under a task shows its duration: fixed, Tri (min/mode/max), U (min–max), N (mean±SD), Exp (mean).</p>`;}
function buildReport(o){
  const R=results,S=R.S,m=model,tu=esc(S.tunit),O=ov(S,R.per),u=esc(O.u),u0=esc(S.unit),per=O.per;
  const date=new Date().toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'});
  const stop=S.stopMode==='count'?`until the counter reaches ${S.cycles} counts (time limit ${fmt(S.horizon,0)} ${tu})`:`for ${fmt(S.horizon,0)} ${tu} of simulated time`;
  const c0=R.counters[0];
  let h=`<h1>${esc(o.title)}</h1><div class="meta">${esc(date)}${o.by?' · Prepared by '+esc(o.by):''} · CYCLONE Simulator</div>`;
  if(R.stale)h+=`<p class="warn"><b>Note:</b> the model was edited after the last run. Run the simulation again before relying on these results.</p>`;
  if(c0)h+=`<div class="box"><div class="big">${fmt(c0.rate.m*O.k,O.d)} <span style="font-size:11pt;font-weight:400">${u} per ${per}</span></div>
   <div>${R.reps>1?`95% confidence interval ± ${fmt(c0.rate.ci*O.k,O.d)} · `:''}${fmt(c0.perT*O.kT,4)} ${u}/${tu} · ${fmt(c0.cyc,2)} ${tu} per count · measured at “${esc(c0.name)}”</div></div>`;
  h+=`<h2>1. Purpose and method</h2><p>This report presents a CYCLONE (Cyclic Operations Network) simulation of the operation described by the diagram in section 2. CYCLONE models a repetitive operation as resources (for example trucks and a loader) that move through activities and wait in queues. An activity starts when the resources it needs are available. Activity durations vary randomly, so the model is run many times and the results are averaged.</p>
  <table><tr><th class="l">Setting</th><th class="l">Value</th></tr>
  <tr><td>Run length</td><td class="l">${stop}</td></tr><tr><td>Replications</td><td class="l">${R.reps} (random seed ${esc(S.seed)})</td></tr>
  <tr><td>Quantity per count</td><td class="l">${fmt(S.load,3)} ${u0}</td></tr><tr><td>Results shown as</td><td class="l">${u} per ${per}${O.note?' ('+esc(O.note)+')':''}</td></tr><tr><td>Time unit</td><td class="l">${tu}</td></tr></table>
  <h2>2. Network diagram</h2><figure>${reportDiagram()}<figcaption>Figure 1. CYCLONE network${m.name?': '+esc(m.name):''}. Symbols are explained in section 3.</figcaption></figure>
  <h2>3. Legend</h2>${reportLegend()}
  <h2>4. Model data</h2><table><tr><th>No.</th><th class="l">Type</th><th class="l">Name</th><th>Start units</th><th class="l">Duration (${tu})</th><th class="l">Other</th></tr>
  ${[...m.nodes].sort((a,b)=>a.num-b.num).map(n=>`<tr><td>${n.num}</td><td class="l">${esc(TNAME[n.type]||n.type)}</td><td class="l">${esc(n.name)}</td><td>${n.type==='queue'?n.init:'–'}</td><td class="l">${n.type==='combi'||n.type==='normal'?esc(distText(n)):'–'}</td><td class="l">${n.type==='con'?'CON '+n.k:(n.type==='queue'&&n.gen>1?'GEN '+n.gen:'')}</td></tr>`).join('')}</table>
  <h2>5. Simulation results</h2>`;
  if(R.capped)h+=`<p class="warn">${R.capped} run${R.capped>1?'s':''} stopped at the safety limit of 400,000 task starts, so results cover only about ${fmt(R.Tavg,1)} ${tu}.</p>`;
  if(R.incomplete)h+=`<p class="warn">${R.incomplete} run${R.incomplete>1?'s':''} reached the time limit before ${S.cycles} counts.</p>`;
  h+=`<p>${R.reps} run${R.reps>1?'s':''} of about ${fmt(R.Tavg,1)} ${tu} each.</p>`;
  if(R.curve)h+=`<figure>${curveSvg(R.curve)}<figcaption>Figure 2. Cumulative count over time (first run).</figcaption></figure>`;
  h+=`<h3>Production</h3><table><tr><th class="l">Counter</th><th>Count per run</th><th>${u} per ${per}</th>${R.reps>1?'<th>± 95% CI</th>':''}</tr>${R.counters.map(c=>`<tr><td class="l">${c.num} ${esc(c.name)}</td><td>${fmt(c.cnt.m,1)}</td><td>${fmt(c.rate.m*O.k,O.d)}</td>${R.reps>1?`<td>${fmt(c.rate.ci*O.k,O.d)}</td>`:''}</tr>`).join('')}</table>
  <h3>Activities</h3><table><tr><th class="l">Task</th><th>Starts per run</th><th>Average busy</th></tr>${R.tasks.map(t=>`<tr><td class="l">${t.num} ${esc(t.name)}</td><td>${fmt(t.starts,1)}</td><td>${fmt(t.busy,2)}${t.type==='combi'&&t.busy<=1?` (${fmt(t.busy*100,0)}%)`:''}</td></tr>`).join('')}</table>
  <h3>Queues (idle units)</h3><table><tr><th class="l">Queue</th><th>Average</th><th>Maximum</th><th>% time not empty</th><th>Average wait (${tu})</th><th>At end</th></tr>${R.queues.map(q=>`<tr><td class="l">${q.num} ${esc(q.name)}</td><td>${fmt(q.len,2)}</td><td>${fmt(q.max,0)}</td><td>${fmt(q.ne,1)}</td><td>${fmt(q.wait,1)}</td><td>${fmt(q.end,0)}</td></tr>`).join('')}</table>`;
  if(sweepRows&&sweepRows.length){const mx=Math.max(...sweepRows.map(r=>r.rate)),best=sweepRows.find(r=>r.rate>=.95*mx);
    h+=`<h3>Fleet sweep</h3><p>The model was re-run with different starting units in one queue. The highlighted row is the smallest number reaching 95% of the best result.</p><table><tr><th>Units</th><th>${u} per ${per}</th><th>Gain</th></tr>${sweepRows.map((r,i)=>`<tr class="${r===best?'best':''}"><td>${r.v}${r===best?' ★':''}</td><td>${fmt(r.rate*O.k,O.d)}</td><td>${i?(r.rate-sweepRows[i-1].rate>=0?'+':'')+fmt((r.rate-sweepRows[i-1].rate)*O.k,O.d):'–'}</td></tr>`).join('')}</table>`;}
  const ins=(R.insights||[]);
  h+=`<h2>6. Notes and interpretation</h2>${ins.length?'<ul>'+ins.map(t=>`<li>${t}</li>`).join('')+'</ul>':''}${o.note?`<p><b>Notes and assumptions:</b> ${esc(o.note).replace(/\n/g,'<br>')}</p>`:''}
  <p>The results are estimates from a simulation. They depend on the activity durations and starting resources entered in the model, and on random variation between runs. Compare them with field measurements before using them for decisions.</p>
  <div class="foot">Prepared with CYCLONE Simulator (method: Halpin, Construction Management, Cyclic Operations Network). ${esc(date)}.</div>`;
  $('#report').innerHTML=h;
  let st=document.getElementById('pgsize');if(!st){st=document.createElement('style');st.id='pgsize';document.head.appendChild(st);}
  st.textContent=`@media print{@page{size:A4 ${o.ori}}}`;}
function openMenu(){const card=$('#modalcard');
  card.innerHTML=libHtml()+`<h4>Examples</h4><div style="display:grid;gap:6px">${Object.entries(EX).map(([k,e])=>`<button data-ex="${k}" style="text-align:left"><b>${esc(e.title)}</b><br><span class="mut" style="font-size:12px">${esc(e.sub)}</span></button>`).join('')}</div>
  <div class="row" style="margin-top:8px"><button id="mnew" style="flex:1">New blank project</button></div>
  <h4>Save or restore</h4><p class="note" style="margin-top:0">Copy this text to keep a backup. Paste a backup here and tap Apply to restore it. The app also remembers your work on this device.</p>
  <textarea id="mjson" spellcheck="false">${esc(JSON.stringify(model))}</textarea>
  <div class="row" style="margin-top:8px"><button id="mcopy" style="flex:1">Copy</button><button id="mapply" class="pri" style="flex:1">Apply</button></div>
  <h4>Notation (Halpin)</h4><p class="note" style="margin-top:0">Circle with a tick: queue (idle units). Square: Normal task. Square with a corner slash: Combi task. Circle with a flag: counter. Plain circle: CON n, which turns n units into 1. GEN n on a queue turns each arriving unit into n. Lower-numbered Combi tasks start first.</p>
  <div style="margin-top:8px"><button id="mclose" style="width:100%">Close</button></div>`;
  showModal();
  $('#mclose').onclick=()=>closeModal();
  card.querySelectorAll('[data-ex]').forEach(b=>b.onclick=()=>{pushUndo();const e=EX[b.dataset.ex];loadModel(e.build());closeModal();toast(e.title);});
  $('#mnew').onclick=()=>{pushUndo();loadModel(blankModel());closeModal();};
  $('#mcopy').onclick=async()=>{const ta=$('#mjson');try{await navigator.clipboard.writeText(ta.value);toast('Copied');}catch(e){ta.select();toast('Select and copy the text manually');}};
  $('#mapply').onclick=()=>{try{const m=JSON.parse($('#mjson').value);if(!Array.isArray(m.nodes)||!Array.isArray(m.arcs))throw 0;pushUndo();loadModel(m);closeModal();toast('Applied');}catch(e){toast('That text is not a valid project');}};bindLib(card);}
function sanitize(m){const T=['queue','combi','normal','func','con'],seen=new Set();let nid=1;
  m.nodes=(m.nodes||[]).filter(n=>n&&T.includes(n.type)&&Number.isFinite(+n.x)&&Number.isFinite(+n.y));
  m.nodes.forEach(n=>{n.x=+n.x;n.y=+n.y;if(!Number.isFinite(+n.id)||seen.has(+n.id)){while(seen.has(nid))nid++;n.id=nid;}n.id=+n.id;seen.add(n.id);
    n.name=String(n.name==null?'':n.name);if(!Number.isFinite(+n.num))n.num=n.id;n.num=+n.num;
    ['init','a','b','c'].forEach(k=>{n[k]=Number.isFinite(+n[k])?+n[k]:0;});n.dist=DISTS[n.dist]?n.dist:'fixed';n.gen=Math.max(1,Math.round(+n.gen||1));n.k=Math.max(1,Math.round(+n.k||1));});
  const ids=new Set(m.nodes.map(n=>n.id)),aseen=new Set();let aid=1;
  const ak=new Set();m.arcs=(m.arcs||[]).filter(a=>{if(!(a&&ids.has(+a.from)&&ids.has(+a.to)&&+a.from!==+a.to))return false;const k=+a.from+'>'+(+a.to);if(ak.has(k))return false;ak.add(k);return true;});
  m.arcs.forEach(a=>{a.from=+a.from;a.to=+a.to;if(!Number.isFinite(+a.id)||aseen.has(+a.id)){while(aseen.has(aid))aid++;a.id=aid;}a.id=+a.id;aseen.add(a.id);});
  m.nid=Math.max(0,...m.nodes.map(n=>n.id))+1;m.aid=Math.max(0,...m.arcs.map(a=>a.id))+1;return m;}
function loadModel(m){sanitize(m);m.settings=Object.assign(blankModel().settings,m.settings||{});m.nid=m.nid||Math.max(0,...m.nodes.map(n=>n.id))+1;m.aid=m.aid||Math.max(0,...m.arcs.map(a=>a.id))+1;
  model=m;sel=null;results=null;sweepRows=null;invalidate();linkFrom=null;render();fit();renderTab();save();}
let modalPushed=false;
function showModal(){$('#modal').hidden=false;if(!modalPushed){try{history.pushState({m:1},'');modalPushed=true;}catch(e){}}const f=$('#modal').querySelector('button,textarea');}
function closeModal(){$('#modal').hidden=true;if(modalPushed){modalPushed=false;try{history.back();}catch(e){}}}
window.addEventListener('popstate',()=>{if(!$('#modal').hidden){modalPushed=false;$('#modal').hidden=true;}});
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)closeModal();});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});
$('#fab').onclick=fit;$('#saveb').onclick=openSave;
$('#cDel').onclick=()=>{if(!sel)return;sel.t==='n'?delNode(sel.id):delArc(sel.id);render();save();renderTab();};
$('#cLink').onclick=()=>{if(!sel||sel.t!=='n')return toast('Select a node first');const id=sel.id;sel=null;setTool('link');linkFrom=id;render();toast('Now tap the node to link to');};
$('#emEx').onclick=openMenu;
$('#emNew').onclick=()=>{setTool('select');addNode('queue');};
svg.addEventListener('pointerdown',()=>{if(!tipSeen){tipSeen=true;try{localStorage.setItem('cyclone-tip','1');}catch(e){}$('#hint').textContent='';}},true);
(function(){let y0=null;const g=$('#grab');g.addEventListener('pointerdown',e=>{y0=e.clientY;g.setPointerCapture(e.pointerId);});
 g.addEventListener('pointerup',e=>{if(y0===null)return;const dy=e.clientY-y0;y0=null;const sh=$('#sheet');if(dy>24&&!sh.classList.contains('col'))$('#chev').click();else if(dy<-24&&sh.classList.contains('col'))$('#chev').click();else if(Math.abs(dy)<=24)$('#chev').click();});})();
$('#menu').onclick=openMenu;
$('#undo').onclick=doUndo;
document.querySelectorAll('#tools [data-tool]').forEach(b=>b.onclick=()=>setTool(b.dataset.tool));
document.querySelectorAll('#tools [data-add]').forEach(b=>b.onclick=()=>{setTool('select');addNode(b.dataset.add);});
document.querySelectorAll('#tabs [data-tab]').forEach(b=>b.onclick=()=>{if(tab===b.dataset.tab&&!$('#sheet').classList.contains('col')&&false)return;setTab(b.dataset.tab,true);});
$('#chev').onclick=()=>{const c=$('#sheet').classList.toggle('col');$('#chev').textContent=c?'⌃':'⌄';$('#chev').setAttribute('aria-expanded',String(!c));setTimeout(fit,30);};
window.addEventListener('resize',()=>{fit();});

/* ---------- start ---------- */
(function init(){try{tipSeen=localStorage.getItem('cyclone-tip')==='1';}catch(e){}let m=null;try{m=JSON.parse(localStorage.getItem('cyclone-v1')||'null');}catch(e){}
  if(!m||!Array.isArray(m.nodes)||!m.nodes.length)m=exampleModel();
  model=sanitize(m);model.settings=Object.assign(blankModel().settings,model.settings||{});render();requestAnimationFrame(()=>{fit();});renderTab();})();

(function(){const bar=document.getElementById('inst'),b=document.getElementById('instB'),t=document.getElementById('instT');let dp=null;
 const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
 let dismissed=false;try{dismissed=localStorage.getItem('cyclone-inst')==='1';}catch(e){}
 if(standalone||dismissed)return;
 window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;t.textContent='Install CYCLONE as an app on this device';b.hidden=false;bar.hidden=false;});
 window.addEventListener('appinstalled',()=>{bar.hidden=true;});
 b.onclick=async()=>{if(!dp)return;dp.prompt();try{await dp.userChoice;}catch(e){}dp=null;bar.hidden=true;};
 document.getElementById('instX').onclick=()=>{bar.hidden=true;try{localStorage.setItem('cyclone-inst','1');}catch(e){}};
 const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
 if(ios){t.textContent='To install: tap Share, then Add to Home Screen';b.hidden=true;bar.hidden=false;}
})();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
